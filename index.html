<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="GossHive app links, privacy, and account deletion resources.">
  <title>GossHive</title>
  <link rel="icon" type="image/png" href="app-icon.png">
  <link rel="apple-touch-icon" href="app-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Space+Grotesk:wght@500;700&display=swap"
    rel="stylesheet"
  >
  <style>
    :root {
      --bg: #f5efe7;
      --paper: #fffaf2;
      --ink: #1d1b17;
      --muted: #6a6258;
      --accent: #d1552a;
      --accent-2: #2f5d59;
      --accent-3: #f0c56b;
      --shadow: rgba(32, 24, 16, 0.12);
      --ring: rgba(209, 85, 42, 0.25);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Newsreader", Georgia, serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 8%, rgba(47, 93, 89, 0.16), transparent 38%),
        radial-gradient(circle at 88% 18%, rgba(209, 85, 42, 0.16), transparent 42%),
        linear-gradient(135deg, #f6ede4 0%, #f2f5ef 60%, #efe6dc 100%);
      padding: 32px 20px 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    main {
      width: min(980px, 100%);
      background: var(--paper);
      border-radius: 28px;
      padding: 56px 60px 50px;
      box-shadow: 0 28px 70px -40px var(--shadow);
      border: 1px solid rgba(47, 93, 89, 0.12);
      position: relative;
      overflow: hidden;
      margin-top: auto;
    }

    main::before {
      content: "";
      position: absolute;
      inset: -140px -120px auto auto;
      height: 260px;
      width: 260px;
      background: radial-gradient(circle, rgba(209, 85, 42, 0.22), transparent 70%);
      pointer-events: none;
    }

    main::after {
      content: "";
      position: absolute;
      inset: auto auto -120px -120px;
      height: 240px;
      width: 240px;
      background: radial-gradient(circle, rgba(47, 93, 89, 0.2), transparent 70%);
      pointer-events: none;
    }

    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .app-icon {
      width: 140px;
      height: 140px;
      border-radius: 32px;
      object-fit: cover;
      box-shadow:
        0 32px 64px -32px rgba(209, 85, 42, 0.4),
        0 8px 16px -8px rgba(47, 93, 89, 0.2),
        inset 0 1px 0 0 rgba(255, 255, 255, 0.4);
      border: 1px solid rgba(47, 93, 89, 0.15);
      transition: transform 200ms ease, box-shadow 200ms ease;
    }

    .app-icon:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow:
        0 40px 80px -32px rgba(209, 85, 42, 0.5),
        0 12px 24px -8px rgba(47, 93, 89, 0.25),
        inset 0 1px 0 0 rgba(255, 255, 255, 0.4);
    }

    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 0.18em;
      font-size: 0.72rem;
      font-family: "Space Grotesk", "Trebuchet MS", sans-serif;
      color: var(--accent-2);
      margin: 0;
      font-weight: 500;
    }

    h1 {
      margin: 0;
      font-family: "Space Grotesk", "Trebuchet MS", sans-serif;
      font-size: clamp(2.8rem, 3.1vw + 1.2rem, 4rem);
      line-height: 1.1;
    }

    .tagline {
      margin: 0;
      font-size: 1.22rem;
      color: var(--muted);
      max-width: 620px;
      line-height: 1.65;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 999px;
      background: rgba(240, 197, 107, 0.18);
      color: #6a4c16;
      font-size: 0.95rem;
      font-family: "Space Grotesk", "Trebuchet MS", sans-serif;
      width: fit-content;
    }

    .status span {
      font-size: 1rem;
    }

    footer {
      width: min(980px, 100%);
      margin-top: 24px;
      margin-bottom: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
      color: var(--muted);
      text-align: center;
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
    }

    .footer-links a {
      border-radius: 999px;
      padding: 10px 18px;
      border: 1px solid rgba(209, 85, 42, 0.3);
      background: rgba(209, 85, 42, 0.08);
      transition: transform 150ms ease, box-shadow 150ms ease;
    }

    .footer-links a:hover,
    .footer-links a:focus {
      text-decoration: none;
      transform: translateY(-1px);
      box-shadow: 0 12px 24px -20px rgba(0, 0, 0, 0.4);
    }

    a {
      color: var(--accent);
      text-decoration: none;
      font-family: "Space Grotesk", "Trebuchet MS", sans-serif;
      font-size: 0.95rem;
    }

    a:focus-visible {
      outline: 2px solid var(--ring);
      outline-offset: 3px;
      border-radius: 999px;
    }

    @media (max-width: 720px) {
      main {
        padding: 38px 28px 32px;
      }

      .app-icon {
        width: 110px;
        height: 110px;
        border-radius: 26px;
      }

      header {
        gap: 22px;
      }

      .tagline {
        font-size: 1.08rem;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <img class="app-icon" src="app-icon.png" alt="GossHive app icon">
      <h1>GossHive</h1>
      <p class="tagline">
        The brutally honest social app. Swipe to judge. Get judged. See what the
        hive really thinks.
      </p>
      <div class="status">Launching soon on iOS and Android</div>
    </header>
  </main>

  <footer>
    <div class="footer-links" aria-label="GossHive links">
      <a href="https://gosshive.app/privacy">Privacy</a>
      <a href="https://gosshive.app/child-safety">Child Safety</a>
      <a href="https://gosshive.app/delete-account">Delete Account</a>
      <a href="https://gosshive.app/contact">Contact</a>
    </div>
    <div>GossHive resources and contact details.</div>
  </footer>
</body>
</html>
