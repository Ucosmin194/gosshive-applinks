<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Email Confirmed - GossHive</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ffbd59">
  <link rel="icon" type="image/png" href="../assets/favicon.png">
  <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
  <link rel="preload" href="../assets/fonts/archivo-latin-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../assets/site.css">
  <script>
    /* Pick the hive before first paint: After Dark from 21:00 to 04:00 local time, as in the app. */
    (function () {
      var h = new Date().getHours();
      document.documentElement.dataset.hive = (h >= 21 || h < 4) ? 'dark' : 'gut';
    })();
  </script>
</head>
<body>
  <main class="status">
    <div class="status-card">
      <div class="bee-fig" aria-hidden="true">
        <img src="../assets/bee-sticker.webp" alt="" width="593" height="640">
        <span class="pupil pupil--l"></span>
        <span class="pupil pupil--r"></span>
      </div>
      <h1 id="title">Email confirmation</h1>

      <!-- Loading State -->
      <div id="loading">
        <div class="spinner" aria-hidden="true"></div>
        <p>Confirming your email...</p>
      </div>

      <!-- Success State -->
      <div id="success" class="hidden">
        <p>Email confirmed.</p>
        <p>Opening the GossHive app...</p>
        <div class="actions">
          <button class="btn btn--primary" type="button" onclick="openApp()">Open the app now</button>
        </div>
      </div>

      <!-- Error State -->
      <div id="error" class="hidden">
        <p id="errorMessage">Something went wrong.</p>
        <div class="actions">
          <button class="btn btn--primary" type="button" onclick="openApp()">Try opening the app</button>
        </div>
        <div class="stores">
          <a class="store" id="appStoreBtn" href="https://apps.apple.com/app/gosshive/id6757358951">
            <span class="store-small">Download on the</span>
            <span class="store-big">App Store</span>
          </a>
          <a class="store" id="playStoreBtn" href="https://play.google.com/store/apps/details?id=app.gosshive">
            <span class="store-small">Get it on</span>
            <span class="store-big">Google Play</span>
          </a>
        </div>
      </div>

      <!-- No Tokens State -->
      <div id="noTokens" class="hidden">
        <p>Please check your email for the confirmation link.</p>
        <div class="stores">
          <a class="store" href="https://apps.apple.com/app/gosshive/id6757358951">
            <span class="store-small">Download on the</span>
            <span class="store-big">App Store</span>
          </a>
          <a class="store" href="https://play.google.com/store/apps/details?id=app.gosshive">
            <span class="store-small">Get it on</span>
            <span class="store-big">Google Play</span>
          </a>
        </div>
      </div>
    </div>
  </main>

  <script>
    const loading = document.getElementById('loading');
    const success = document.getElementById('success');
    const error = document.getElementById('error');
    const noTokens = document.getElementById('noTokens');
    const errorMessage = document.getElementById('errorMessage');
    const title = document.getElementById('title');

    // Get URL parameters from query string (?)
    const urlParams = new URLSearchParams(window.location.search);

    // Get URL parameters from hash fragment (#) - Supabase sends tokens here
    const hashParams = new URLSearchParams(window.location.hash.substring(1));

    // Try to get tokens from either location
    const accessToken = hashParams.get('access_token') || urlParams.get('access_token');
    const refreshToken = hashParams.get('refresh_token') || urlParams.get('refresh_token');
    const errorParam = hashParams.get('error') || urlParams.get('error');
    const errorDescription = hashParams.get('error_description') || urlParams.get('error_description');
    const tokenHash = urlParams.get('token_hash') || hashParams.get('token_hash');
    const type = urlParams.get('type') || hashParams.get('type');

    // Debug logging: which tokens arrived, never their values
    console.log('Found tokens:', {
      accessToken: accessToken ? 'YES' : 'NO',
      refreshToken: refreshToken ? 'YES' : 'NO',
      tokenHash: tokenHash ? 'YES' : 'NO',
      error: errorParam || 'NO'
    });

    function getMobileOS() {
      const userAgent = navigator.userAgent.toLowerCase();
      if (userAgent.includes('android')) return 'Android';
      if (userAgent.includes('iphone') || userAgent.includes('ipad')) return 'iOS';
      return 'Other';
    }

    function openApp() {
      const deepLink = 'gosshive://auth/callback?success=true';
      console.log('Attempting deep link:', deepLink);

      // Try to open the app
      window.location.href = deepLink;

      // Fallback: Show the right store button after 2.5 seconds if the app didn't open
      setTimeout(() => {
        const os = getMobileOS();
        const appStoreBtn = document.getElementById('appStoreBtn');
        const playStoreBtn = document.getElementById('playStoreBtn');

        if (appStoreBtn && playStoreBtn) {
          appStoreBtn.hidden = os === 'Android';
          playStoreBtn.hidden = os === 'iOS';
        }
      }, 2500);
    }

    function showSuccess() {
      loading.classList.add('hidden');
      success.classList.remove('hidden');
      title.textContent = 'Welcome to GossHive!';

      // Auto-attempt to open app after 1.5 seconds
      setTimeout(() => {
        openApp();
      }, 1500);
    }

    function showError(message) {
      loading.classList.add('hidden');
      error.classList.remove('hidden');
      title.textContent = 'Confirmation failed';
      errorMessage.textContent = message;
    }

    function showNoTokens() {
      loading.classList.add('hidden');
      noTokens.classList.remove('hidden');
      title.textContent = 'Check your email';
    }

    // Main confirmation handler
    function handleConfirmation() {
      // Check for errors first
      if (errorParam) {
        console.error('Error from Supabase:', errorParam, errorDescription);
        showError(errorDescription || 'Email confirmation failed. Please try again or contact support.');
        return;
      }

      // If we have access_token, confirmation was successful!
      if (accessToken) {
        console.log('Email confirmed. Access token found.');
        showSuccess();
        return;
      }

      // Legacy: Check for token_hash (older Supabase flow)
      if (tokenHash && type === 'signup') {
        console.log('Email confirmed. Token hash found.');
        showSuccess();
        return;
      }

      // No tokens found - user probably just visited the page directly
      console.log('No confirmation tokens found');
      showNoTokens();
    }

    // Run on page load
    handleConfirmation();
  </script>
</body>
</html>
