<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Confirmed - GossHive</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .icon {
            font-size: 4em;
            margin-bottom: 20px;
            animation: bounce 0.6s ease;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        h1 {
            font-size: 2em;
            margin-bottom: 15px;
        }
        p {
            font-size: 1.1em;
            opacity: 0.9;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        .btn {
            padding: 15px 30px;
            background: rgba(255, 255, 255, 0.9);
            color: #667eea;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s;
            border: none;
            cursor: pointer;
            font-size: 1em;
            display: inline-block;
        }
        .btn:hover {
            background: white;
            transform: translateY(-2px);
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon" id="icon">🐝</div>
        <h1 id="title">Email Confirmation</h1>
        
        <!-- Loading State -->
        <div id="loading">
            <div class="spinner"></div>
            <p>Confirming your email...</p>
        </div>

        <!-- Success State -->
        <div id="success" class="hidden">
            <p>✅ Email confirmed successfully!</p>
            <p>Opening GossHive app...</p>
            <div class="buttons">
                <button class="btn" onclick="openApp()">📱 Open App Now</button>
            </div>
        </div>

        <!-- Error State -->
        <div id="error" class="hidden">
            <p id="errorMessage">❌ Something went wrong</p>
            <div class="buttons">
                <button class="btn" onclick="openApp()">📱 Try Opening App</button>
                <a href="https://apps.apple.com/app/gosshive" class="btn" id="appStoreBtn">🍎 App Store</a>
                <a href="https://play.google.com/store/apps/details?id=com.gosshive.app" class="btn" id="playStoreBtn">🤖 Play Store</a>
            </div>
        </div>

        <!-- No Tokens State -->
        <div id="noTokens" class="hidden">
            <p>Please check your email for the confirmation link.</p>
            <div class="buttons">
                <a href="https://apps.apple.com/app/gosshive" class="btn">🍎 App Store</a>
                <a href="https://play.google.com/store/apps/details?id=com.gosshive.app" class="btn">🤖 Play Store</a>
            </div>
        </div>
    </div>

    <script>
        const loading = document.getElementById('loading');
        const success = document.getElementById('success');
        const error = document.getElementById('error');
        const noTokens = document.getElementById('noTokens');
        const errorMessage = document.getElementById('errorMessage');
        const icon = document.getElementById('icon');
        const title = document.getElementById('title');

        // Get URL parameters from query string (?)
        const urlParams = new URLSearchParams(window.location.search);
        
        // Get URL parameters from hash fragment (#) - Supabase sends tokens here
        const hashParams = new URLSearchParams(window.location.hash.substring(1));
        
        // Try to get tokens from either location
        const accessToken = hashParams.get('access_token') || urlParams.get('access_token');
        const refreshToken = hashParams.get('refresh_token') || urlParams.get('refresh_token');
        const errorParam = hashParams.get('error') || urlParams.get('error');
        const errorDescription = hashParams.get('error_description') || urlParams.get('error_description');
        const tokenHash = urlParams.get('token_hash') || hashParams.get('token_hash');
        const type = urlParams.get('type') || hashParams.get('type');

        // Debug logging
        console.log('URL:', window.location.href);
        console.log('Query params:', Object.fromEntries(urlParams));
        console.log('Hash params:', Object.fromEntries(hashParams));
        console.log('Found tokens:', {
            accessToken: accessToken ? 'YES' : 'NO',
            refreshToken: refreshToken ? 'YES' : 'NO',
            tokenHash: tokenHash ? 'YES' : 'NO',
            error: errorParam || 'NO'
        });

        function getMobileOS() {
            const userAgent = navigator.userAgent.toLowerCase();
            if (userAgent.includes('android')) return 'Android';
            if (userAgent.includes('iphone') || userAgent.includes('ipad')) return 'iOS';
            return 'Other';
        }

        function openApp() {
            const deepLink = 'gosshive://auth/callback?success=true';
            console.log('Attempting deep link:', deepLink);
            
            // Try to open the app
            window.location.href = deepLink;
            
            // Fallback: Show app store buttons after 2.5 seconds if app didn't open
            setTimeout(() => {
                const os = getMobileOS();
                const appStoreBtn = document.getElementById('appStoreBtn');
                const playStoreBtn = document.getElementById('playStoreBtn');
                
                if (appStoreBtn && playStoreBtn) {
                    if (os === 'iOS') {
                        appStoreBtn.style.display = 'inline-block';
                        playStoreBtn.style.display = 'none';
                    } else if (os === 'Android') {
                        appStoreBtn.style.display = 'none';
                        playStoreBtn.style.display = 'inline-block';
                    } else {
                        appStoreBtn.style.display = 'inline-block';
                        playStoreBtn.style.display = 'inline-block';
                    }
                }
            }, 2500);
        }

        function showSuccess() {
            loading.classList.add('hidden');
            success.classList.remove('hidden');
            icon.textContent = '✅';
            title.textContent = 'Welcome to GossHive!';
            
            // Auto-attempt to open app after 1.5 seconds
            setTimeout(() => {
                openApp();
            }, 1500);
        }

        function showError(message) {
            loading.classList.add('hidden');
            error.classList.remove('hidden');
            icon.textContent = '❌';
            title.textContent = 'Confirmation Failed';
            errorMessage.textContent = message;
        }

        function showNoTokens() {
            loading.classList.add('hidden');
            noTokens.classList.remove('hidden');
            icon.textContent = '📧';
            title.textContent = 'Check Your Email';
        }

        // Main confirmation handler
        function handleConfirmation() {
            // Check for errors first
            if (errorParam) {
                console.error('Error from Supabase:', errorParam, errorDescription);
                showError(errorDescription || 'Email confirmation failed. Please try again or contact support.');
                return;
            }

            // If we have access_token, confirmation was successful!
            if (accessToken) {
                console.log('✅ Email confirmed! Access token found.');
                showSuccess();
                return;
            }

            // Legacy: Check for token_hash (older Supabase flow)
            if (tokenHash && type === 'signup') {
                console.log('✅ Email confirmed! Token hash found.');
                showSuccess();
                return;
            }

            // No tokens found - user probably just visited the page directly
            console.log('ℹ️ No confirmation tokens found');
            showNoTokens();
        }

        // Run on page load
        handleConfirmation();
    </script>
</body>
</html>
